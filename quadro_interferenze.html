<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quadro Territoriale delle Interferenze — Archivio documentale</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="tracciato_suite.js"></script>
<script src="map_workspace.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1727;color:#e2e8f0;font:13px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}button,input,select{font:inherit}a{color:#7dd3fc}button,select,input{background:#1b2b41;border:1px solid #42546d;color:#e2e8f0;border-radius:7px;padding:9px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid #7dd3fc;outline-offset:3px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #334155;padding:14px 20px}header h1{font-size:15px;margin:0}header select{flex:1;min-width:220px;max-width:600px}#workspace{display:grid;grid-template-columns:minmax(320px,40%) 1fr;flex:1;min-height:0}aside{overflow:auto;border-right:1px solid #334155;padding:20px}#map{position:relative;min-height:200px}#map-canvas{position:absolute;inset:0}#basemap-toggle{position:absolute;z-index:3;top:96px;right:16px;background:#0d1727ed;border-color:#64748b;box-shadow:0 2px 10px #0008}h2{font-size:14px;margin:22px 0 10px}p{line-height:1.6}.muted{color:#9dafc6}.document{padding:13px;border:1px solid #334155;border-radius:9px;margin-bottom:8px;background:#142238}.document small{display:block;color:#9dafc6;margin-top:6px;overflow-wrap:anywhere}.quality{padding:12px;border-left:3px solid #38bdf8;background:#112d40;line-height:1.6}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#search{width:100%}.row{padding:14px 0;border-bottom:1px solid #334155;line-height:1.7;overflow-wrap:anywhere}.row strong{display:block}.row small{color:#fbbf24}.row a{margin-right:12px}#map-status{position:absolute;z-index:2;left:16px;top:64px;right:16px;padding:12px 15px;background:#0d1727ed;border:1px solid #42546d;border-radius:9px;line-height:1.6}#pagination{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}#notice{padding:12px;background:#33271a;color:#fde68a;border-radius:8px;margin:10px 0}.maplibregl-popup-content{color:#0f172a;line-height:1.6;font-size:12px}#collection{font-size:11px;color:#9dafc6;line-height:1.6;margin-top:18px}@media(max-width:800px){header{padding:12px;gap:9px}header h1{font-size:13px}#workspace{display:flex;flex-direction:column-reverse}#map{height:36dvh;flex-shrink:0}aside{border:0;border-top:1px solid #334155;padding:16px;flex:1;min-height:0}header select{width:100%;max-width:none;flex-basis:100%}#map-status{top:60px}#basemap-toggle{top:12px;right:12px}}
</style>
</head>
<body>
<header><a href="/">← Mappa opere</a><h1>Quadro Territoriale delle Interferenze</h1><select id="opera-select" aria-label="Opera"><option>Caricamento archivio…</option></select></header>
<div id="workspace">
<aside>
  <h2 id="opera-title">Documenti pubblicati dagli enti</h2>
  <p id="opera-source"></p>
  <div id="quality" class="quality" role="status">Caricamento…</div>
  <div id="notice" hidden></div>
  <h2>Originali archiviati</h2><div id="documents"></div>
  <h2>Ditte e riferimenti catastali estratti</h2>
  <input id="search" aria-label="Cerca intestatario, comune, foglio o particella" placeholder="Cerca nominativo, comune, foglio, mappale…">
  <div class="tools"><button id="export-csv">Esporta righe con fonti</button><button id="export-geo">Esporta geometrie effettive</button></div>
  <div id="rows"></div>
  <div id="pagination"><button id="previous">Precedenti</button><span id="page-count" role="status"></span><button id="next">Successive</button></div>
  <div id="collection"></div>
</aside>
<div id="map"><div id="map-canvas"></div><button id="basemap-toggle" type="button" aria-pressed="false">Mostra satellite</button><div id="map-status" role="status">Le particelle saranno visualizzate solo con geometrie effettive.</div></div>
</div>
<script>
'use strict';
let catalogue=[], currentRows=[], filteredRows=[], features=[], pageIndex=0, selectedSlug='', selectionVersion=0, parcelMap=null;
const pageSize=75, element=id=>document.getElementById(id), html=escapeMapHtml;
try {
 parcelMap=new maplibregl.Map({container:'map-canvas',style:{version:8,sources:{street:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Tiles © Esri — Sources: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, METI, and the GIS User Community'},satellite:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery © Esri, Vantor, Earthstar Geographics, and the GIS User Community'},satelliteLabels:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Reference labels © Esri'}},layers:[{id:'street-base',type:'raster',source:'street'},{id:'satellite-base',type:'raster',source:'satellite',layout:{visibility:'none'}},{id:'satellite-labels',type:'raster',source:'satelliteLabels',layout:{visibility:'none'}}]},center:[12.5,42.5],zoom:5,pitch:0,renderWorldCopies:false});
 parcelMap.addControl(new maplibregl.NavigationControl(),'top-right');
 parcelMap.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');
 parcelMap.on('load',()=>{
  parcelMap.addSource('parcels',{type:'geojson',data:{type:'FeatureCollection',features}});
  parcelMap.addLayer({id:'parcel-fill',type:'fill',source:'parcels',paint:{'fill-color':'#0284c7','fill-opacity':.28}});
  parcelMap.addLayer({id:'parcel-line',type:'line',source:'parcels',paint:{'line-color':'#0369a1','line-width':2}});
  parcelMap.on('click','parcel-fill',event=>{
   const p=event.features[0].properties;
   new maplibregl.Popup().setLngLat(event.lngLat).setHTML(`<strong>${html(p.riferimento_catastale || 'Particella catastale')}</strong><br>${html(p.comune)} · Fg. ${html(p.foglio)} · Mapp. ${html(p.mappale)}${p.sezione_catastale_geometria ? ` · Sez. ${html(p.sezione_catastale_geometria)}` : ''}<br>${Number(p.righe_collegate)} righe/subalterni collegati · identificativi confrontati con l’atto<br>Geometria del catasto corrente; intestazioni OCR ancora da verificare<br><a href="${safeArchiveLink(p.documento_url)}" target="_blank" rel="noopener">Documento originale · pag. ${Number(p.fonte_pagina)}</a>${p.fonte_geometria ? `<br><a href="${safeSourceLink(p.fonte_geometria)}" target="_blank" rel="noopener">Risposta catastale WFS · SHA256 ${html(p.fonte_geometria_sha256)}</a>` : ''}`).addTo(parcelMap);
  });
  element('basemap-toggle').addEventListener('click',()=>{const satellite=parcelMap.getLayoutProperty('satellite-base','visibility')!=='visible';parcelMap.setLayoutProperty('street-base','visibility',satellite?'none':'visible');for(const layer of ['satellite-base','satellite-labels'])parcelMap.setLayoutProperty(layer,'visibility',satellite?'visible':'none');element('basemap-toggle').setAttribute('aria-pressed',String(satellite));element('basemap-toggle').textContent=satellite?'Mostra mappa stradale':'Mostra satellite';});
  drawGeometry();
 });
} catch(error) {element('map-status').textContent='Cartografia non disponibile. Documenti e righe restano consultabili.';}
async function request(url){const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error(`Archivio non disponibile (${response.status})`);return response.json();}
function documentMarkup(doc){return `<div class="document"><a href="/api/documenti/${html(doc.id)}/file" target="_blank" rel="noopener">${html(doc.titolo)}</a><small>${doc.totale_pagine ?? '?'} pagine · ${doc.righe_estratte} righe estratte · ${html(doc.modalita)}</small><small><a href="${safeSourceLink(doc.fonte_url)}" target="_blank" rel="noopener">Fonte dell’ente</a> · SHA256 ${html(doc.sha256)}</small></div>`;}
async function selectOpera(slug){
 const version=++selectionVersion;selectedSlug=slug;pageIndex=0;currentRows=[];features=[];renderRows();drawGeometry();
 const opera=catalogue.find(o=>o.slug===slug);if(!opera)return;
 history.replaceState(null,'',`?opera=${encodeURIComponent(slug)}`);
 element('opera-title').textContent=opera.titolo;
 element('opera-source').innerHTML=`${html(opera.ente_promotore || '')}<br><a href="${safeSourceLink(opera.fonte_atto_url)}" target="_blank" rel="noopener">Pagina ufficiale dell’opera</a>`;
 element('documents').innerHTML=(opera.documenti || []).map(documentMarkup).join('') || '<p class="muted">Nessun originale ancora acquisito. La pagina ufficiale è collegata; il download non è completato.</p>';
 element('notice').hidden=true;
 try{
  const rows=await request(`/api/opere/${encodeURIComponent(slug)}/particelle`);if(version!==selectionVersion)return;
  currentRows=rows;const localized=rows.filter(r=>r.geometry);const parcels=new Map();
  for(const r of localized){const key=r.riferimento_catastale || r.id;const existing=parcels.get(key);if(existing){existing.properties.righe_collegate++;continue;}parcels.set(key,{type:'Feature',id:key,geometry:r.geometry,properties:{id:r.id,comune:r.comune,foglio:r.foglio,mappale:r.mappale,sezione_catastale_geometria:r.sezione_catastale_geometria,riferimento_catastale:r.riferimento_catastale,righe_collegate:1,documento_url:r.documento_url,fonte_pagina:r.fonte_pagina,fonte_geometria:r.fonte_geometria,fonte_geometria_sha256:r.fonte_geometria_sha256}});}
  features=Array.from(parcels.values());
  const review=rows.filter(r=>r.stato_estrazione==='ocr_da_verificare').length;
  element('quality').textContent=`${rows.length} righe estratte · ${review} trascrizioni OCR da verificare · ${localized.length} righe con geometria. Copertura dell’opera non certificata.`;
  renderRows();drawGeometry();
 }catch(error){element('notice').hidden=false;element('notice').textContent=error.message;}
}
function renderRows(){
 const q=normalizeMapSearch(element('search').value);
 filteredRows=currentRows.filter(r=>normalizeMapSearch(`${r.intestatario || ''} ${r.comune || ''} ${r.foglio} ${r.mappale}`).includes(q));
 const pages=Math.max(1,Math.ceil(filteredRows.length/pageSize));pageIndex=Math.min(pageIndex,pages-1);
 element('rows').innerHTML=filteredRows.slice(pageIndex*pageSize,(pageIndex+1)*pageSize).map(r=>`<div class="row"><strong>${html(r.intestatario || 'Intestazione non leggibile')}</strong>${html(r.comune || '')} · Foglio ${html(r.foglio)} · Particella ${html(r.mappale)}${r.sub ? ' · Sub '+html(r.sub):''}<br><small>${r.stato_identificativi==='verificati_su_documento'?'Identificativi catastali verificati sull’atto · nominativi OCR da verificare':r.stato_estrazione==='ocr_da_verificare'?'Trascrizione OCR da verificare sull’originale':'Estratto da documento testuale'}</small><br><a href="${safeArchiveLink(r.documento_url)}" target="_blank" rel="noopener">Originale · pagina ${r.fonte_pagina}</a><a href="${safeSourceLink(r.fonte_url)}" target="_blank" rel="noopener">Fonte ente</a><br><span class="muted">${r.geometry?`Geometria catastale ${html(r.riferimento_catastale || '')} · riscontro attuale`:'Geometria non acquisita: nessuna posizione attribuita'}</span></div>`).join('') || '<p class="muted">Nessuna riga disponibile per questa ricerca.</p>';
 element('page-count').textContent=`Pagina ${pageIndex+1}/${pages} · ${filteredRows.length} righe`;
 element('previous').disabled=pageIndex===0;element('next').disabled=pageIndex>=pages-1;
 element('export-csv').disabled=filteredRows.length===0;element('export-geo').disabled=features.length===0;
}
function drawGeometry(){
 if(!parcelMap)return;
 const source=parcelMap.getSource('parcels');if(!source)return;
 source.setData({type:'FeatureCollection',features});
 element('map-status').textContent=features.length ? `${features.length} particelle uniche localizzate (${features.reduce((n,f)=>n+Number(f.properties.righe_collegate || 1),0)} righe/subalterni collegati). Identificativi confrontati con gli atti; intestazioni OCR da verificare.` : 'Geometrie catastali non ancora acquisite. I nominativi non vengono posizionati sul centro del comune o su un tracciato indicativo.';
 if(features.length){const bounds=new maplibregl.LngLatBounds();function add(coords){if(typeof coords[0]==='number')bounds.extend(coords);else coords.forEach(add);}features.forEach(f=>add(f.geometry.coordinates));parcelMap.fitBounds(bounds,{padding:70,maxZoom:17,duration:0});}
}
function download(content,mime,name){const url=URL.createObjectURL(new Blob([content],{type:mime}));const anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
element('opera-select').addEventListener('change',e=>selectOpera(e.target.value));element('search').addEventListener('input',()=>{pageIndex=0;renderRows();});
element('previous').onclick=()=>{pageIndex--;renderRows();};element('next').onclick=()=>{pageIndex++;renderRows();};
element('export-geo').onclick=()=>download(JSON.stringify({type:'FeatureCollection',features},null,2),'application/geo+json',`${selectedSlug}.geojson`);
element('export-csv').onclick=()=>{
 const fields=['comune','foglio','mappale','sub','intestatario','stato_identificativi','stato_estrazione','stato_geometria','riferimento_catastale','fonte_url','fonte_pagina','fonte_sha256','fonte_geometria','fonte_geometria_sha256'];
 const cell=value=>'"'+String(value ?? '').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
 download('\ufeff'+[fields,...filteredRows.map(r=>fields.map(k=>r[k]))].map(row=>row.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8',`${selectedSlug}.csv`);
};
(async()=>{try{catalogue=await request('/api/opere');element('opera-select').innerHTML=catalogue.map(o=>`<option value="${html(o.slug)}">${html(o.titolo)}</option>`).join('');const chosen=new URLSearchParams(location.search).get('opera');const slug=catalogue.some(o=>o.slug===chosen)?chosen:catalogue.find(o=>o.righe_catastali>0)?.slug || catalogue[0]?.slug;if(slug){element('opera-select').value=slug;await selectOpera(slug);}else{element('quality').textContent='Archivio vuoto: nessun documento di produzione acquisito.';}
 const status=await request('/api/archivio/stato');const errors=status.ultime_acquisizioni.filter(a=>a.stato==='errore_download'||a.stato==='errore_localizzazione').length;element('collection').textContent=`Archivio: ${status.documenti} originali, ${status.righe} righe. Ultimi tentativi di acquisizione con errore: ${errors}. Gli errori di rete non equivalgono ad assenza di documenti pubblicati.`;
}catch(error){element('quality').textContent=error.message;}})();
</script>
</body>
</html>
