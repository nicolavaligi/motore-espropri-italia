[project]
name = "motore-espropri-italia"
version = "2.0.0"
description = "Archivio documentale delle opere pubbliche, ditte catastali e geometrie con provenienza"
readme = "README.md"
authors = [
    { name = "Houdinick", email = "305862309+nicolavaligi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.28.1",
    "geopandas>=1.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.2",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
motore-espropri-italia = "motore_espropri_italia:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "test_motore_espropri.py"]
addopts = "--import-mode=importlib"
